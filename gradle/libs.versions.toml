[versions]
agp = "9.4.1"
kotlin = "2.4.21"
termux = "0.118.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# AGP 9 compiles Kotlin itself; the plugin is only put on the classpath to pick the Kotlin version.
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

[libraries]
termux-terminal-view = { group = "com.termux.termux-app", name = "terminal-view", version.ref = "termux" }
